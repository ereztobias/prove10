<!-- Absolute, not relative. GitHub Pages serves this file for a miss at
     any depth, so /a/b/c would resolve styles.css against /a/b/. -->
<link rel="stylesheet" href="/styles.css">
<style>
  /* The one thing this page adds: a way back. Sized like body text
     rather than a button, because it is an offer, not an instruction. */
  .back {
    margin: 0;
    color: var(--muted);
  }
  .back a {
    color: var(--ink);
    text-decoration-color: var(--faint);
    text-underline-offset: 4px;
    transition: text-decoration-color 160ms ease;
  }
  .back a:hover { text-decoration-color: var(--accent); }
</style>
</head>
<body>
  <div class="field" aria-hidden="true"></div>

  <div class="page">

    <header class="top">
      <a class="wordmark" href="/" style="color:inherit;text-decoration:none"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11"/><path class="bolt" d="M18.6 7.1 10.5 17.5h4.6l-1.7 7.3 8.1-10.3h-4.6z"/></svg>Prove<b>10</b></a>
      <span class="chip"><i></i>404</span>
    </header>

    <main class="stage reveal">
      <h1 style="--d:0ms">
        Nothing here.
        <em>Not yet, anyway.</em>
      </h1>

      <p class="back" style="--d:180ms">There is one page so far, and this

    <footer class="bottom reveal">
      <span class="foot-links" style="--d:280ms">
        <a class="contact" href="mailto:hello@prove10.com">hello@prove10.com</a>
        <a class="contact" href="/privacy/">Privacy policy</a>
      </span>
      <span class="rights" style="--d:280ms">&copy; <span id="year">2026</span> prove10</span>
    </footer>

  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
