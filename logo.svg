<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Prove10">
  <title>Prove10</title>
  <!-- A bolt inside a seal: the ring is the proof, the bolt is how fast
       it comes back. Geometry rather than type, so it needs no font and
       holds from a 16px favicon up to an app icon. -->
  <rect width="64" height="64" rx="14" fill="#070910"/>
  <g transform="translate(3.2,3.2) scale(1.8)">
    <circle cx="16" cy="16" r="11" fill="none" stroke="#8fa6ff" stroke-width="3.2"/>
    <path d="M18.6 7.1 10.5 17.5h4.6l-1.7 7.3 8.1-10.3h-4.6z" fill="#e9edf6"/>
  </g>
</svg>
