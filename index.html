<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prove10</title>
<meta name="description" content="Prove10 is building something new. Coming soon.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#06080e">
<link rel="canonical" href="https://prove10.com/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Prove10">
<meta property="og:url" content="https://prove10.com/">
<meta property="og:title" content="Prove10">
<meta property="og:description" content="We are building something new. Stay tuned.">
<meta property="og:image" content="https://prove10.com/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Prove10 — we are building something new. Stay tuned.">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Prove10">
<meta name="twitter:description" content="We are building something new. Stay tuned.">
<meta name="twitter:image" content="https://prove10.com/og.jpg">
<!-- The SVG is what a modern browser picks. The .ico stays because
     everything that is not a browser still asks for it by name, and the
     touch icon stays because iOS screenshots the page without one. -->
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="field" aria-hidden="true"></div>

  <div class="page">

    <header class="top">
      <span class="wordmark"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11"/><path class="bolt" d="M18.6 7.1 10.5 17.5h4.6l-1.7 7.3 8.1-10.3h-4.6z"/></svg>Prove<b>10</b></span>
    </header>

    <main class="stage reveal">
      <p class="chip" style="--d:0ms"><i></i>coming soon</p>

      <h1 style="--d:60ms">
        We are building something new.
        <em>Stay tuned.</em>
      </h1>

      <form class="capture" id="capture" novalidate style="--d:180ms">
        <label class="sr" for="email">Email address</label>
        <input id="email" name="email" type="email" inputmode="email"
               autocomplete="email" placeholder="you@company.com" required>
        <button type="submit">Keep me posted</button>
      </form>

      <p class="consent" style="--d:220ms">One email when there is something to
        use. Nothing else, ever.</p>

      <p class="note" id="note" style="--d:240ms"></p>
    </main>

    <footer class="bottom reveal">
      <span class="foot-links" style="--d:320ms">
        <a class="contact" href="mailto:hello@prove10.com">hello@prove10.com</a>
        <a class="contact" href="/privacy/">Privacy policy</a>
      </span>
      <span class="rights" style="--d:320ms">&copy; <span id="year">2026</span> Prove10</span>
    </footer>

  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    var form = document.getElementById('capture');
    var note = document.getElementById('note');
    // Separate origin on purpose: the apex stays DNS-only for GitHub Pages.
    var ENDPOINT = 'https://api.prove10.com/subscribe';

    function say(msg, kind) {
      note.textContent = msg;
      note.className = 'note ' + (kind || '');
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var field = document.getElementById('email');
      var value = field.value.trim();

      if (!/^[^@\s]+@[^@\s.]+\.[^@\s]{2,}$/.test(value)) {
        say('That address does not look right. Check it and try again.', 'warn');
        field.focus();
        return;
      }

      form.setAttribute('aria-busy', 'true');
      say('Sending.');

      fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: value })
      }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        // Not on the list yet. The address is stored but unconfirmed,
        // and nothing is ever sent to it until that link is used.
        form.innerHTML = '<p class="done">Check your inbox. Tap the link we just sent and you are in.</p>';
        say('Nothing after a minute? Look in spam.');
      }).catch(function () {
        // The endpoint is real now, so a failure is a failure: leave the
        // form standing so they can simply try again.
        say('That did not go through. Try again.', 'warn');
      }).then(function () {
        form.removeAttribute('aria-busy');
      });
    });
  </script>
</body>
</html>
