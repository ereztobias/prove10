<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prove10 list</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#06080e">
<!-- The list lives on the Worker: the apex is static GitHub Pages and
     must stay DNS-only so GitHub keeps renewing its certificate. This
     page exists so the short URL still goes somewhere. -->
<meta http-equiv="refresh" content="0; url=https://api.prove10.com/emails">
<link rel="canonical" href="https://api.prove10.com/emails">
<style>
  :root { color-scheme: dark }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    text-align: center;
    background: #06080e;
    color: #e9edf6;
    font-family: Sora, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 300;
    line-height: 1.6;
    padding-left:  max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { display: grid; gap: 1rem; max-width: 34ch }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 300; letter-spacing: -0.03em }
  p { margin: 0; color: #7c879c; font-size: 0.9375rem }
  a { color: #8fa6ff; text-underline-offset: 3px; word-break: break-all }
  .wordmark { display: inline-flex; align-items: center; justify-self: center;
    font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.02em;
    color: #e9edf6; text-decoration: none; word-break: normal }
  .wordmark b { font-weight: 600; color: #8fa6ff }
  .mark { flex: none; width: 1.3em; height: 1.3em; margin-right: 0.45em }
  .mark circle { fill: none; stroke: #8fa6ff; stroke-width: 3.2 }
  .mark .bolt { fill: currentColor; stroke: none }
</style>
</head>
<body>
  <main>
    <a class="wordmark" href="/"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11"/><path class="bolt" d="M18.6 7.1 10.5 17.5h4.6l-1.7 7.3 8.1-10.3h-4.6z"/></svg>Prove<b>10</b></a>
    <h1>Taking you to the list</h1>
    <p>If nothing happens, open
      <a href="https://api.prove10.com/emails">api.prove10.com/emails</a>
    </p>
  </main>
  <script>location.replace('https://api.prove10.com/emails');</script>
</body>
</html>
