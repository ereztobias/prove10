name = "prove10-subscribe"
main = "src/index.js"
compatibility_date = "2026-10-01"

# A custom domain, not a route on the apex: prove10.com must stay
# DNS-only so GitHub Pages can keep renewing its certificate.
[[routes]]
pattern = "api.prove10.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "prove10-signups"
database_id = "c3ddbd73-6496-4751-8084-6c78d9acd36e"

# Retained logs, so a failed send can be read after the fact instead of
# only while someone is watching `wrangler tail`.
[observability]
enabled = true
head_sampling_rate = 1
