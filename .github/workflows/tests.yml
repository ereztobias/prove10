# The suite runs here, on this repo's own Actions minutes, and reports to
# testai. The tests live in worker/, which is why every step below runs
# there: the repo root is a static site with no package.json.
name: tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  # So a pull request proves itself before it is merged. Worth having now
  # that work arrives on a branch; when everything went straight to main
  # this would have run the same commit twice for nothing.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      # A red suite is still a result: record it, then fail the job.
      - name: Run the suite
        id: suite
        continue-on-error: true
        run: npx vitest run --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/report.json"

      # Fetched rather than vendored, so a new version of the recorder
      # costs this job nothing. version.json names the files to take.
      # Unreachable is a warning for the same reason the recording step
      # below is: the suite has already run by now.
      - name: Fetch the recorder
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          mkdir -p "$RUNNER_TEMP/testai"
          for f in testai-record.mjs reduce.mjs; do
            if ! curl -fsSL --retry 3 -o "$RUNNER_TEMP/testai/$f" "https://testai.prove10.com/bin/$f"; then
              echo "::warning::could not fetch $f from testai, so this run was not recorded."
              rm -f "$RUNNER_TEMP/testai/testai-record.mjs"
              exit 0
            fi
          done

      # Says why rather than failing red when the ingest token has not
      # been added yet: that is setup left undone, not a broken build.
      # Only what shipped. A pull request run is recorded nowhere: its
      # commit is a merge GitHub made up for the occasion, and a history
      # of those says nothing about what prove10 was running.
      #
      # A WARNING, NOT A FAILURE. Recording is telemetry: testai being
      # down, unreachable, or out of D1 writes for the day says nothing
      # about whether this suite passed. It turned the job red once
      # already (run 41121938498: a green suite reported as a failed
      # build), and that is the kind of red that teaches people to
      # ignore red. The suite result still gates the job, below.
      - name: Record the run in testai
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        env:
          TESTAI_TOKEN: ${{ secrets.TESTAI_TOKEN_PROVE10 }}
        run: |
          if [ -z "$TESTAI_TOKEN" ]; then
            echo "::notice::TESTAI_TOKEN_PROVE10 is not set, so this run was not recorded."
            exit 0
          fi
          if [ ! -f "$RUNNER_TEMP/testai/testai-record.mjs" ]; then
            echo "::warning::the recorder was not fetched, so this run was not recorded."
            exit 0
          fi
          if [ ! -f "$RUNNER_TEMP/report.json" ]; then
            echo "::warning::vitest wrote no report, so this run was not recorded."
            exit 0
          fi
          if ! node "$RUNNER_TEMP/testai/testai-record.mjs" --project prove10 \
            --from "$RUNNER_TEMP/report.json" --commit "${GITHUB_SHA::7}"; then
            echo "::warning::testai did not accept this run, so it was not recorded."
          fi

      - name: Fail if the suite failed
        if: ${{ steps.suite.outcome == 'failure' }}
        run: exit 1
