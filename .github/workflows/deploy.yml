# The Worker ships from here, so that a commit which changes worker/ cannot
# go green in CI and still leave api.prove10.com running last week's code.
# The apex is a separate story: GitHub Pages deploys the static site on its
# own, which is exactly the asymmetry this file closes.
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Nothing else in the repo is part of the Worker, and a change to the
    # landing page should not redeploy it.
    paths:
      - 'worker/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

# Deploys queue rather than race. Never cancel one in flight: a cancelled
# `wrangler deploy` is an unknown version live, and a cancelled migration is
# worse.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      # A missing token fails loudly here, unlike the testai secret in
      # tests.yml. That one guards a recording: skipping it loses a
      # datapoint. This one guards the deploy, and a deploy that quietly
      # does nothing while the job goes green is how you spend an afternoon
      # debugging code that was never live.
      - name: Check the credentials are present
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not set, so nothing can be deployed."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set, so nothing can be deployed."; exit 1; }
          # A token pasted with a line break inside it goes straight into
          # an Authorization header, and wrangler fails with
          # `Headers.set: "..." is an invalid header value`, naming no
          # secret, after the whole suite has already run. That cost the
          # first deploy on 2026-10-30. Caught here by name instead.
          #
          # The value is not repaired, only rejected: a trimmed copy is a
          # different string from the one GitHub masks in logs, and the
          # real fix belongs in the secret, not in every run.
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            eval "value=\$$name"
            case $value in
              *[[:space:]]*)
                echo "::error::$name contains whitespace, which cannot go in an HTTP header. Re-set the secret as one unbroken line."
                exit 1
                ;;
            esac
          done

      # The gate. tests.yml runs the same suite and reports it to testai;
      # this run reports nothing and exists only to stop a red commit
      # reaching production. Worth the extra ~20s: a deploy gated on a
      # suite in another workflow is a deploy gated on nothing.
      - name: Run the suite
        run: npx vitest run

      # Before the code, not after: a migration adds what the new code
      # expects to find. The reverse order would serve requests against a
      # column that is not there yet.
      #
      # The deployed database predates this folder and was migrated by
      # hand, so it carries a ledger written once by the one-off in
      # worker/README.md. Without that, this step would try to re-apply
      # 0002 and fail on a duplicate column.
      - name: Apply migrations to the deployed database
        run: npx wrangler d1 migrations apply prove10-signups --remote

      # Secrets live on the Worker, not in this repo: IP_SALT,
      # ADMIN_PASSWORD, RESEND_API_KEY and MAIL_FROM survive a deploy
      # untouched, and nothing here needs to know them.
      - name: Deploy the Worker
        run: npx wrangler deploy

      # A green `wrangler deploy` means Cloudflare accepted the upload,
      # not that the Worker works. This asks the real hostname a question
      # only a running router can answer: GET /subscribe is a 405 with an
      # Allow header. No database, no mail, no side effect.
      #
      # /robots.txt is the obvious probe and the wrong one. It is cached
      # for a day, so the edge would keep answering it long after the
      # Worker stopped working. This response is no-store.
      #
      # It retries because a deploy takes a moment to reach every colo,
      # and a smoke test that fires too early fails for the wrong reason.
      - name: Smoke test the deployed Worker
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -o /dev/null -D /tmp/smoke-headers -w '%{http_code}' https://api.prove10.com/subscribe || echo 000)
            allow=$(tr -d '\r' < /tmp/smoke-headers | awk -F': ' 'tolower($1) == "allow" { print $2 }')
            if [ "$status" = "405" ] && [ "$allow" = "POST, OPTIONS" ]; then
              echo "api.prove10.com answered $status, Allow: $allow"
              exit 0
            fi
            echo "attempt $attempt: status=$status allow=${allow:-none}, retrying in 5s"
            sleep 5
          done
          echo "::error::api.prove10.com never answered 405 with Allow: POST, OPTIONS. The new version is live and wrong: roll it back with \`npx wrangler rollback\`."
          exit 1

      - name: Say what is live
        if: ${{ always() }}
        run: npx wrangler deployments list --name prove10-subscribe 2>/dev/null | head -20 || true
